<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1520" viewBox="0 0 1080 1520">
  <defs>
    <linearGradient id="bg2" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#edf6f9"/>
      <stop offset="100%" stop-color="#f8efe5"/>
    </linearGradient>
